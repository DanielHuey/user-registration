<ui:composition template="/template/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:my="http://java.sun.com/jsf/composite/agani"
                xmlns:p="http://primefaces.org/ui"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">
    <ui:define name="nav">
        Dependants
        #{indexBean.router('deplist')}
    </ui:define>
    <ui:define name="content">
        #{adminBean.restrictToAdmin()}
        #{indexBean.refreshUsersAndDependants()}
        #{indexBean.setPageRange('d')}
        <h3 class="petCaps">My Cards</h3>
        <div class="rad12 flexDisplay flexRow">
            <my:stat icon="gender-female" label="Female Dependants" value="#{statBean.femaleDependants}"/>
            <my:stat icon="gender-male" label="Male Dependants" value="#{statBean.maleDependants}"/>
        </div>
        <h3 class="petCaps">Search #{'&amp;'} Filter</h3>
        <div id="randomname" class="pad20 bgp rad24 flexDisplay flexColumn">
            <h:form styleClass="flexDisplay flexRow mt">
                <p:inputText styleClass="pill pad10 mb noShadow noBorder fillWidth" value="#{indexBean.search}" pt:placeholder="Search...">
                    <p:ajax event="keyup" listener="#{indexBean.searchD()}" update=":depForm:depList"/>
                </p:inputText>
            </h:form>
            <h:form id="filters">
                <div class="flexDisplay flexRow middle">
                    <p:selectOneRadio value="#{indexBean.filteredGender}">
                        <f:selectItems value="#{indexBean.filterOptions}" var="filterOpt" itemLabel="#{filterOpt}" itemValue="#{filterOpt}"/>
                        <p:ajax event="change" listener="#{indexBean.filterDependants(indexBean.filteredUser,indexBean.filteredGender)}" update=":depForm:depList"/>
                    </p:selectOneRadio>
                    <p:inputText styleClass="rad24" value="#{indexBean.filteredUser}" placeholder="Filter User (username)">
                        <p:ajax event="keyup" listener="#{indexBean.filterDependants(indexBean.filteredUser,indexBean.filteredGender)}" update=":depForm:depList"/>
                    </p:inputText>
                    <div class="hpad">
                        <p:commandLink action="#{indexBean.resetFilters()}">
                            <p:ajax event="click" listener="#{indexBean.resetFilters()}" update=":depForm:depList filters"/>
                            <i class="pi pi-filter-slash actionButton bg text-s rad12 square"/>
                        </p:commandLink>
                    </div>
                </div>
            </h:form>
        </div>
        <div class="m flexDisplay flexRowR"><h:form>
            <h:commandButton class="actionButton border bgp tl bl text-a bold" value="Add New" action="/pages/user/settings.xhtml#dependants"/>
            <h:commandButton class="actionButton border bgp tr br text-r bold redText" style="border-left: none" value="Delete All" action="#{indexBean.deleteAll('d')}"/>
        </h:form></div>
        <h:form id="depForm" class="flexColumn pad10 rad12 bgp xOverflow">
            <p:autoUpdate/>
            <p:dataTable widgetVar="depTable" id="depList"
                         value="#{indexBean.searchDependantList}" var="dep"
                         rows="5" rowsPerPageTemplate="5,10,15" rowStyleClass="userRow">
                <p:column headerText="No." width="12px">#{dep.id}</p:column>
                <p:column headerText="FirstName">#{dep.firstname}</p:column>
                <p:column headerText="LastName">#{dep.lastname}</p:column>
                <p:column headerText="Gender">#{dep.gender}</p:column>
                <p:column headerText="User">#{dep.owner.username}</p:column>
                <p:column headerText="Date Of Birth">#{dep.dateOfBirthString}</p:column>
                <p:column headerText="Username">#{dep.username}</p:column>
                <p:column headerText="Actions">
                    <h:form>
                        <p:commandButton styleClass="noBorder actionButton pill mt mr" action="#{depBean.edit(dep.username,dep.owner.username)}" icon="pi pi-pencil" />
                        <p:commandButton styleClass="noBorder text-r actionButton pill mt mr" action="#{depBean.delete(dep.username)}" icon="pi pi-trash"/>
                    </h:form>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
