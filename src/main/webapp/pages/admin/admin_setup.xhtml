<ui:composition template="/template/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" xmlns:p="http://primefaces.org/ui">
    <ui:define name="content">
        <div class="m bgp rad12 pad20">
            #{adminBean.restrictIfUsersExist()}
            <h:form>
                <h1>Register An Admin</h1>
                <p:messages/>
                <h:panelGrid columns="2">
                    <h:outputLabel for="username" value="Admin Username"/>
                    <h:inputText styleClass="rad12 border" id="username" type="text" value="#{adminBean.username}" pt:placeholder="abc_123" required="true">
                        <f:validator validatorId="uNameVal"/>
                    </h:inputText>
                    <h:outputLabel for="firstname" value="First Name"/>
                    <h:inputText styleClass="rad12 border" id="firstname" value="#{adminBean.firstname}" pt:placeholder="Firstname" required="true">
                        <f:validator validatorId="nameVal"/>
                    </h:inputText>
                    <h:outputLabel for="lastname" value="Last Name"/>
                    <h:inputText styleClass="rad12 border" id="lastname" value="#{adminBean.lastname}" pt:placeholder="Lastname" required="true"/>
                    <h:outputLabel for="dateOfBirth" value="Date of Birth"/>
                    <p:calendar styleClass=" border pad10 noBorder" id="dateOfBirth" navigator="true" pattern="dd/MM/yyyy" yearRange="1900:c" maxdate="t" value="#{adminBean.dateOfBirth}" pt:placeholder="Select a date..." required="true">
                        <f:validator validatorId="dobVal"/>
                    </p:calendar>
                    <h:outputLabel for="email" value="Email"/>
                    <h:inputText styleClass="rad12" id="email" value="#{adminBean.email}" pt:placeholder="Email Address [mail@site.com]" required="true">
                        <f:validator validatorId="emailVal"/>
                        <p:message for="email"/>
                    </h:inputText>
                    <h:outputLabel value="Password"/>
                    <h:inputSecret styleClass="rad12" id="password" value="#{adminBean.password}" pt:placeholder="Password [a@#1G%!*]" required="true" validatorMessage="Password should have at lest 4 characters">
                        <f:validateLength minimum="4"/>
                        <p:message for="password"/>
                    </h:inputSecret>
                </h:panelGrid>
                <h:commandButton styleClass="pad10 rad12 mt noBorder hpad inputSubmit" value="Save" action="#{adminBean.register(false)}"/>
                <h:commandLink styleClass="ml" value="Save and Login" action="#{adminBean.register(true)}"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
