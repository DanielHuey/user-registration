<ui:composition template="/template/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:my="http://java.sun.com/jsf/composite/agani"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="nav">
        Users
        #{indexBean.router('userlist')}
    </ui:define>
    <ui:define name="content">
        #{adminBean.restrictToAdmin()}
        #{indexBean.refreshUsersAndDependants()}
        #{indexBean.setPageRange('u')}
        <h3 class="petCaps ml mb">Search</h3>
        <div class="hpad pad10 rad24 bgp">
            <h:form styleClass="flexDisplay flexRow mt mb">
                <p:inputText styleClass="slightShadow rad24 pad10 noBorder fillWidth" value="#{indexBean.search}" pt:placeholder="Search..."/>
                <h:commandLink action="#{indexBean.searchU()}" styleClass="noBorder ml"><i class="pi pi-search pad10 bg square actionButton tl bl text-s"/></h:commandLink>
                <h:commandLink action="#{indexBean.setSearch('')}" styleClass="noBorder"><i class="pi pi-times pad10 bg square actionButton tr br text-s"/></h:commandLink>
            </h:form>
        </div>
        <div class="m flexDisplay flexRow fillWidth" style="justify-content: flex-end">
            <h:commandButton class="actionButton noBorder bga rad12 text-p bold mr" value="Add Admin" action="/pages/admin/admin_setup"/>
            <h:commandButton class="actionButton border bgp tl bl text-a bold" value="Add New" onclick="PF('regUserDialog').show()"/>
            <h:commandButton class="actionButton border bgp tr br text-r bold" style="border-left: none" value="Delete All" onclick="PF('confirmDialog').show()" action="#{indexBean.deleteAll('u')}"/>
        </div>
        <div class="flexColumn pad10 rad12 bgp xOverflow">
            <table class="tableDesign autoMargin mt">
                <thead><tr>
                    <ui:repeat value="#{['No.','FirstName','LastName','Date Of Birth','No. Of Dependants','Username','Email','Actions']}" var="h"><th class="pad10">#{h}</th></ui:repeat>
                </tr></thead>
                <tbody>
                    <ui:repeat value="#{indexBean.paginatedUserList}" var="user">
                        <h:commandLink action="#{userBean.edit(user.username)}">
<!--                            <tr class="userRow #{user.deleted?'text-gray del':''}">-->
                            <tr class="userRow">
                                <td>#{user.id}</td>
                                <td>#{user.firstname}</td>
                                <td>#{user.lastname}</td>
                                <td>#{user.dateOfBirthString}</td>
                                <td>#{user.dependants.size()}</td>
                                <td>#{user.username}</td>
                                <td>#{user.email}</td>
                                <td><h:form styleClass="flexDisplay flexRow">
                                    <h:commandLink styleClass="noBorder actionButton rad12" action="#{userBean.edit(user.username)}"><i class="pi pi-pencil"/></h:commandLink>
                                    <h:commandLink styleClass="noBorder text-r actionButton rad12" action="#{userBean.delete(user.username)}"><i class="pi pi-trash"/></h:commandLink>
                                </h:form></td>
                            </tr>
                        </h:commandLink>
                    </ui:repeat>
                </tbody>
            </table>
            <h:form>
                <p:remoteCommand action="#{indexBean.paginateU(indexBean.resultsPerPage,indexBean.pageNumber)}" name="changeRPP"/>
                <h:panelGrid columns="6">
                    <h:outputLabel styleClass="hpad" for="perPage" value="Results Per Page"/>
                    <p:selectOneMenu id="perPage" value="#{indexBean.resultsPerPage}" onchange="changeRPP();location.reload()">
                        <f:selectItems value="#{[5,10,15]}" var="per" itemLabel="#{per}" itemValue="#{per}"/>
                    </p:selectOneMenu>
                    <div class="hpad flexDisplay flexRow middle">
                        <my:button icon="arrow-left" iconClass="text-s actionButton" action="#{indexBean.nextPage(-1)}"/>
                        <h:outputLabel value="#{indexBean.pageNumber}" styleClass="hpad"/>
                        <my:button icon="arrow-right" iconClass="text-s actionButton" action="#{indexBean.nextPage(1)}"/>
                    </div>
                </h:panelGrid>
            </h:form>
        </div>
        <p:dialog header="Register" widgetVar="regUserDialog" responsive="true" resizable="true" closable="true" closeOnEscape="true">
            <h:form class="autoMargin flexDisplay flexColumn">
<!--                <p:message for="username"/>-->
<!--                <p:message for="firstname"/>-->
<!--                <p:message for="lastname"/>-->
<!--                <p:message for="dateOfBirth"/>-->
<!--                <p:message for="email"/>-->
<!--                <p:message for="password"/>-->
                <p:panelGrid columns="4">
                    <h:outputLabel for="username" value="Username"/>
                    <p:inputText styleClass=" border" id="username" type="text" value="#{userBean.username}" pt:placeholder="Username [abc_123]" required="true" validatorMessage="Invalid Username">
                        <f:validator validatorId="uNameVal"/>
                    </p:inputText>
                    <h:outputLabel for="firstname" value="First Name"/>
                    <p:inputText styleClass="" id="firstname" value="#{userBean.firstname}" pt:placeholder="Firstname [a-Z]" required="true" validatorMessage="Invalid First Name">
                        <f:validator validatorId="nameVal"/>
                    </p:inputText>
                    <h:outputLabel for="lastname" value="Last Name"/>
                    <p:inputText styleClass="" id="lastname" value="#{userBean.lastname}" pt:placeholder="Lastname [a-Z]" required="false"/>
                    <h:outputLabel for="dateOfBirth" value="Date of Birth"/>
                    <p:calendar styleClass=" border noBorder" id="dateOfBirth" navigator="true" pattern="dd/MM/yyyy" yearRange="1900:c" maxdate="t" value="#{userBean.dateOfBirth}" pt:placeholder="Select a date..." required="true">
                        <f:validator validatorId="dobVal"/>
                    </p:calendar>
                    <h:outputLabel for="email" value="Email"/>
                    <p:inputText styleClass="" id="email" value="#{userBean.email}" pt:placeholder="Email Address [mail@site.com]">
                        <f:validateLength minimum="8"/>
                        <f:validateRegex pattern="#{Const.emailRgx}"/>
                    </p:inputText>
                    <h:outputLabel value="Password"/>
                    <h:inputSecret styleClass="fillWidth" id="password" value="#{userBean.password}" pt:placeholder="Password [a@#1G%!*]" required="true" validatorMessage="Password should have at lest 4 characters">
                        <f:validateLength minimum="4"/>
                    </h:inputSecret>
                </p:panelGrid>
                <h:commandButton styleClass="pad10 rad12 mt noBorder hpad inputSubmit" value="Register" action="#{userBean.register}"/>
            </h:form>
        </p:dialog>

        <p:dialog header="Confirm Action" responsive="true" closeOnEscape="true" closable="true" widgetVar="confirmDialog">
            <div class="m">
                <h:form>
                    <h:commandButton style="margin-right:10px;" class="actionButton b2 bgp" value="Return" action="#{authBean.goHomeIfAuthenticated()}"/>
                    <h:commandButton class="actionButton b2 bgp text-r" value="Delete All" action="#{indexBean.confirm('u')}"/>
                </h:form>
            </div>
        </p:dialog>
    </ui:define>
</ui:composition>
